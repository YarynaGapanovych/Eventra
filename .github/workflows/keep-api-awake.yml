name: Keep Render API awake

# Manual ping only. GitHub drops frequent schedules, so this workflow
# cannot keep the Render free service awake. The live ping is a
# cron-job.org job: GET /health every 5 minutes.
on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: GET /health
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 90 https://eventra-api-y6h4.onrender.com/health)"
          test "$body" = "ok"
