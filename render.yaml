services:
  - type: web
    name: eventra-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false && pnpm build
    startCommand: pnpm exec prisma db push && pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
